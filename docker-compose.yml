services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: laravel-app
        container_name: laravel-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - vendor:/var/www/vendor
            - node_modules:/var/www/node_modules
        networks:
            - laravel
        depends_on:
            - db
            - clamav
        environment:
            APP_NAME: ${APP_NAME}
            APP_ENV: ${APP_ENV}
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG}
            APP_URL: ${APP_URL}
            DB_CONNECTION: ${DB_CONNECTION}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            CLAMAV_ENABLED: ${CLAMAV_ENABLED}
            CLAMAV_HOST: clamav
            CLAMAV_PORT: 3310
        ports:
            - "5173:5173"

    webserver:
        image: nginx:alpine
        container_name: laravel-webserver
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
        networks:
            - laravel
        depends_on:
            - app

    db:
        image: mysql:8.0
        container_name: laravel-db
        restart: unless-stopped
        ports:
            - "3310:3306"
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - laravel

    # Malware scanning daemon (docs.clamav.net) used to scan plan-application
    # drawings before they're accepted — see App\Support\ClamAvScanner. Not
    # published to the host: only the app container needs to reach it, over
    # the internal "laravel" network at clamav:3310. First boot is slow
    # (freshclam downloads the virus database, a few hundred MB) — the
    # healthcheck keeps the app from depending on it before it's ready.
    clamav:
        image: clamav/clamav:stable
        container_name: laravel-clamav
        restart: unless-stopped
        volumes:
            - clamavdb:/var/lib/clamav
        networks:
            - laravel
        healthcheck:
            test: ["CMD", "clamdcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 180s

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: laravel-phpmyadmin
        links:
            - db
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            PMA_ARBITRARY: 1
        restart: always
        ports:
            - 8081:80
        networks:
            - laravel

networks:
    laravel:
        driver: bridge

volumes:
    dbdata:
        driver: local
    vendor:
        driver: local
    node_modules:
        driver: local
    clamavdb:
        driver: local
